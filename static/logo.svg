<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#1d4ed8"/>
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>

  <!-- Network map: 3 nodes connected -->
  <!-- Edges first (behind nodes) -->
  <line x1="18" y1="42" x2="32" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="32" y1="22" x2="46" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="18" y1="42" x2="46" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.55"/>

  <!-- Nodes -->
  <circle cx="32" cy="22" r="5" fill="white"/>
  <circle cx="18" cy="42" r="5" fill="white"/>
  <circle cx="46" cy="42" r="5" fill="white"/>

  <!-- Port indicator dots (small inner accent) -->
  <circle cx="32" cy="22" r="2" fill="#3b82f6"/>
  <circle cx="18" cy="42" r="2" fill="#3b82f6"/>
  <circle cx="46" cy="42" r="2" fill="#3b82f6"/>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>
